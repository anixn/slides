# Statistical learning
Statistical learning refers to a set of tools for modeling and understanding complex datasets. It is a recently developed area in statistics and blends with parallel developments in computer science and, in particular, machine learning.

- With the explosion of "Big Data" problems, statistical learning has become a very hot field in many scientific areas as well as marketing, finance, and other business disciplines.
- People with statistical learning skills are in high demand.

.center.co-tip[Statistical learning refers to a vast set of tools for understanding data.]

These tools can be classified as supervised or unsupervised.

1. **Supervised statistical learning** involves building a statistical model for predicting, or estimating, an output based on one or more inputs.
   - Problems of this nature occur in fields as diverse as business, medicine, astrophysics, and
public policy.

1. **Unsupervised statistical learning** there are inputs but no supervising output; nevertheless we can learn relationships and structure from such data.

## What Is Statistical Learning?
.f3[Statistical learning theory is a framework for machine learning drawing from the fields of statistics and functional analysis.]

### A Brief History of Statistical Learning
- **Early 1800s - Linear Methods:** Legendre and Gauss developed least squares, forming the foundation of linear regression for quantitative prediction.
- **1930s-1970s - Classification &amp; GLMs:** Fisher introduced Linear Discriminant Analysis (1936), followed by logistic regression and Generalized Linear Models (GLMs).
- **1980s - Non-linear Learning:** Advances in computing enabled Classification and Regression Trees (CART) and Generalized Additive Models (GAMs), with cross-validation supporting model selection.
- **Modern Era - Statistical Learning &amp; ML:** Statistical learning evolved into a broader field covering supervised and unsupervised learning, accelerated by powerful computing and accessible software such as R.

&gt; Suppose that we are statistical consultants hired by a client to provide advice on how to improve sales of a particular product.
- Which media contribute to sales?
- Which media generate the biggest boost in sales? or
- How much increase in sales is associated with a given increase in TV advertising?

---
## Y = f(X) + `\(\varepsilon\)`

We observe a quantitative response `\(Y\)` and `\(p\)` different predictors, `\(X_1, X_2, \ldots, X_p\)`.

We assume that there is some relationship between `\(Y\)` and `\(X = (X_1, X_2, \ldots, X_p)\)`, which can be written in the very general form in eq. below, .b.red[where &lt;i&gt;f&lt;/i&gt; is some fixed but unknown function] and `\(\varepsilon\)` is a random error.

$$
Y = f(X) + \varepsilon,
$$

## The way to find the function `\(f\)` is the key of statistical learning

There are two main reasons that we may wish to estimate `\(f\)`: .green.b[prediction] and .blue.b[inference].

### Prediction
In many situations, a set of inputs `\(X\)` are readily available, but the output `\(Y\)` cannot be easily obtained. In this setting, since the error term averages to zero, we can predict `\(Y\)` using:
`$$\hat{Y} = f(\hat{X})$$`
where `\(\hat{f}\)` represents our estimate for `\(f\)`, and `\(\hat{Y}\)` represents the resulting prediction for `\(Y\)`.

&gt; As an example, suppose that `\(X_1, \ldots , X_p\)` are characteristics of a patient's blood sample that can be easily measured in a lab, and Y is a variable encoding the patient's risk for a severe adverse reaction to a particular drug.

### Inference
We are often interested in understanding the way that `\(Y\)` is affected as `\(X_1, \ldots, X_p\)` change.

In this situation we wish to estimate `\(f\)`, but our goal is not necessarily to make predictions for `\(Y\)`.

---

# How do we estimate `\(f\)`
- We explore many linear and non-linear approaches for estimating `\(f\)`.
- These methods share certain characteristics and we will overview of these shared characteristics.
- We will always assume that we have observed a set of `\(n\)` different data points.
- These observations are called the training data because we will use these training data observations to train, or teach, our method how to estimate `\(f\)`.

.co-tip[Our goal is to apply a statistical learning method to the training data in order to estimate the unknown function _**f**_.]

---
# 1. Parametric Methods - Overview
Two-step model-based approach:
1. Assume functional form of `\(f\)`
2. Fit/train the model using training data

### Step 1: Assume linear form
Simple assumption: `\(f\)` is **linear** in `\(X\)`: `$$f(X) = \beta_0 + \beta_1 X_1 + \beta_2 X_2 + \ldots + \beta_p X_p$$`

.b[Why to Use:] Instead of estimating arbitrary `\(p\)`-dimensional `\(f(X)\)`, we only estimate `\(p+1\)` coefficients `\(\beta_0, \beta_1, \ldots, \beta_p\)`

### Step 2: Fit the model and estimation method
Estimate parameters `\(\beta_0, \beta_1, \ldots, \beta_p\)` such that:
`$$Y \approx \beta_0 + \beta_1 X_1 + \beta_2 X_2 + \ldots + \beta_p X_p$$`


- .b[Most common:] Ordinary Least Squares
- .b[Alternatives:] Other approaches for parameter estimation

---
# Parametric Approach - Benefits
.pull-left[
**Definition:** Model-based approach reducing estimation of `\(f\)` to estimating a set of parameters

- Easier to estimate `\(\beta_0, \beta_1, \ldots, \beta_p\)` than arbitrary `\(f\)`
- Linear model `\(f(X) = \beta_0 + \beta_1 X_1 + \ldots + \beta_p X_p\)`

### Parametric Approach: Trade-offs
- Chosen model usually won't match true unknown `\(f\)`
- Choose **flexible models** fitting many functional forms
- Flexible models -&gt; more parameters -&gt; **overfitting**

.footnote[Overfitting = following errors/noise too closely]
]

# Overview of Non-Parametric Methods
- Non-parametric methods make no explicit assumptions about the functional form of `\(f\)`, instead seeking an estimate that closely follows the data without excessive wiggliness.

- A key advantage is their flexibility, allowing them to accurately fit a much wider range of possible shapes for the true `\(f\)` than parametric approaches.

- While parametric models risk poor fits if their assumed form deviates from the true `\(f\)`, non-parametric methods inherently avoid this model-misspecification danger.

- The major drawback is that, without reducing `\(f\)` to a small set of parameters, these methods require substantially more observations than parametric models to produce an accurate estimate.

# LDA Projection of Iris Species

.pull-left[

``` r
library(MASS)

# The proper fit: Species ~ all 4 measurements
fit_lda &lt;- lda(Species ~ ., data = iris)
fit_lda

# Predict LDA scores
lda_scores &lt;- predict(fit_lda)$x

# Base R plot of the two discriminants
plot(lda_scores[, 1], lda_scores[, 2],
  main = "LDA Projection of Iris Species",
  xlab = "Linear Discriminant 1 (LD1)",
  ylab = "Linear Discriminant 2 (LD2)",
  pch = 19,
  col = as.numeric(iris$Species)
)
```
]

.pull-right[

``` r
# Predict species for the training data
predicted &lt;- predict(fit_lda)$class

# Confusion Matrix (Predicted vs Actual)
confusion_table &lt;- table(Predicted = predicted, Actual = iris$Species)
confusion_table

# Calculate accuracy
accuracy &lt;- sum(diag(confusion_table)) / sum(confusion_table)
cat("Overall Accuracy:", round(accuracy * 100, 2), "%")
```
]

# Linear Discriminant Analysis (LDA):
&gt; Linear Discriminant Analysis (LDA) is a supervised statistical method used for two main purposes: dimensionality reduction (projecting data onto a lower-dimensional space) and classification (predicting which group a new observation belongs to).

**Model Training:** Fits a Linear Discriminant Analysis (LDA) model using all four numeric measurements (Sepal.Length, Sepal.Width, Petal.Length, Petal.Width) as predictors to classify the three Species in the iris dataset, then prints the model details (prior probabilities and group means).

**Score Extraction:** Computes the linear discriminant scores for each training observation by applying the fitted model, and stores only the projected coordinates ($x) for the first two discriminant axes (LD1 and LD2) into a variable for plotting.

**Visualization:** Generates a scatter plot of the observations in the reduced 2-dimensional LDA space (LD1 vs. LD2), coloring each point by its actual species and adding a legend to distinguish the three groups.


**Classification &amp; Confusion Matrix:** Predicts the species class for the same training data using the fitted LDA model, then builds a confusion matrix (predicted vs. actual labels) to tabulate how many observations were correctly or incorrectly classified.

**Accuracy Evaluation:** Calculates the overall classification accuracy by dividing the sum of the diagonal entries (correct predictions) in the confusion matrix by the total number of observations, and prints the result as a cleanly formatted percentage.
